<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="1100" height="450" style="background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <defs>
        <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>
    </defs>
    <!-- Title -->
    <text x="30" y="40" fill="#F8FAFC" font-size="20" font-weight="700">Fig. 1: 200-Film Benchmark Dataset Overview (Distribution &amp; Feature Correlations)</text>
    <text x="30" y="65" fill="#94A3B8" font-size="13">Empirical dataset of 200 Indian feature films across 3 budget tiers with script-extracted entity features</text>

    <!-- Left Panel: Budget Tier Distribution -->
    <g transform="translate(40, 100)">
        <rect width="460" height="310" rx="10" fill="#1E293B" stroke="#334155"/>
        <text x="20" y="32" fill="#E2E8F0" font-size="15" font-weight="600">Production Tier Distribution (N=200)</text>
        
        <!-- High Tier -->
        <text x="20" y="75" fill="#F8FAFC" font-size="13" font-weight="500">High Budget (50 films, 25%)</text>
        <rect x="20" y="85" width="420" height="26" rx="5" fill="#334155"/>
        <rect x="20" y="85" width="105.0" height="26" rx="5" fill="#EF4444"/>
        <text x="30" y="103" fill="#FFF" font-size="12" font-weight="600">50 Films (Avg Shoot Days: 172d)</text>

        <!-- Medium Tier -->
        <text x="20" y="145" fill="#F8FAFC" font-size="13" font-weight="500">Medium Budget (90 films, 45%)</text>
        <rect x="20" y="155" width="420" height="26" rx="5" fill="#334155"/>
        <rect x="20" y="155" width="189.0" height="26" rx="5" fill="#3B82F6"/>
        <text x="30" y="173" fill="#FFF" font-size="12" font-weight="600">90 Films (Avg Shoot Days: 78d)</text>

        <!-- Low Tier -->
        <text x="20" y="215" fill="#F8FAFC" font-size="13" font-weight="500">Low Budget (60 films, 30%)</text>
        <rect x="20" y="225" width="420" height="26" rx="5" fill="#334155"/>
        <rect x="20" y="225" width="126.0" height="26" rx="5" fill="#10B981"/>
        <text x="30" y="243" fill="#FFF" font-size="12" font-weight="600">60 Films (Avg Shoot Days: 38d)</text>

        <text x="20" y="285" fill="#94A3B8" font-size="12">Schedule range: 18 to 220 shooting days · Budget range: ₹1 Cr to ₹600 Cr</text>
    </g>

    <!-- Right Panel: Feature Pearson r -->
    <g transform="translate(540, 100)">
        <rect width="520" height="310" rx="10" fill="#1E293B" stroke="#334155"/>
        <text x="20" y="32" fill="#E2E8F0" font-size="15" font-weight="600">Feature Correlation with Total Shoot Days (Pearson r)</text>
        <text x="20" y="86" fill="#CBD5E1" font-size="13" font-weight="500">Characters</text>
        <rect x="130" y="70" width="300" height="22" rx="4" fill="#334155"/>
        <rect x="130" y="70" width="268.9" height="22" rx="4" fill="url(#barGrad)"/>
        <text x="408.9" y="86" fill="#A78BFA" font-size="12" font-weight="700">r = 0.896</text>
        <text x="20" y="130" fill="#CBD5E1" font-size="13" font-weight="500">Locations</text>
        <rect x="130" y="114" width="300" height="22" rx="4" fill="#334155"/>
        <rect x="130" y="114" width="279.0" height="22" rx="4" fill="url(#barGrad)"/>
        <text x="419.0" y="130" fill="#A78BFA" font-size="12" font-weight="700">r = 0.930</text>
        <text x="20" y="174" fill="#CBD5E1" font-size="13" font-weight="500">Props</text>
        <rect x="130" y="158" width="300" height="22" rx="4" fill="#334155"/>
        <rect x="130" y="158" width="276.3" height="22" rx="4" fill="url(#barGrad)"/>
        <text x="416.3" y="174" fill="#A78BFA" font-size="12" font-weight="700">r = 0.921</text>
        <text x="20" y="218" fill="#CBD5E1" font-size="13" font-weight="500">Costumes</text>
        <rect x="130" y="202" width="300" height="22" rx="4" fill="#334155"/>
        <rect x="130" y="202" width="271.2" height="22" rx="4" fill="url(#barGrad)"/>
        <text x="411.2" y="218" fill="#A78BFA" font-size="12" font-weight="700">r = 0.904</text>
        <text x="20" y="262" fill="#CBD5E1" font-size="13" font-weight="500">Equipment</text>
        <rect x="130" y="246" width="300" height="22" rx="4" fill="#334155"/>
        <rect x="130" y="246" width="280.4" height="22" rx="4" fill="url(#barGrad)"/>
        <text x="420.4" y="262" fill="#A78BFA" font-size="12" font-weight="700">r = 0.935</text>
        <text x="20" y="290" fill="#94A3B8" font-size="11">Strong inter-feature collinearity is typical for film scripts as scale scales all assets together.</text>
    </g>
    </svg>